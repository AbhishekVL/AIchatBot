
<!DOCTYPE html>
<html>
<head>
    <title>AVL AI Assistant</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background: #f4f6f9;
        }

        .chat-container {
            max-width: 850px;
            margin: 40px auto;
        }

        .chat-box {
            background: white;
            padding: 25px;
            border-radius: 12px;
            min-height: 400px;
            max-height: 550px;
            overflow-y: auto;
        }

        .user-message {
            background: #dbeafe;
            padding: 12px;
            border-radius: 10px;
            margin: 15px 0;
            margin-left: 15%;
        }

        .ai-message {
            background: #e9ecef;
            padding: 12px;
            border-radius: 10px;
            margin: 15px 0;
            margin-right: 15%;
            white-space: pre-wrap;
        }

        textarea {
            resize: none;
        }
    </style>
</head>

<body>

<div class="container chat-container">

    <h2 class="text-center mb-4">
        AVL Chatbot - AI Assistant
    </h2>

    <div class="chat-box mb-3">

        {% for msg in messages %}

            {% if msg.role == 'user' %}

                <div class="user-message">
                    <strong>You:</strong>
                    <p class="mb-0">{{ msg.content }}</p>
                </div>

            {% else %}

                <div class="ai-message">
                    <strong>AVL Chatbot:</strong>
                    <p class="mb-0">{{ msg.content }}</p>
                </div>

            {% endif %}

        {% empty %}

            <h5 class="text-center text-muted mt-5">
                Welcome to AVL AI Assistant!
            </h5>

            <p class="text-center text-muted">
                Ask me anything to get started.
            </p>

        {% endfor %}

    </div>

    <div class="card p-3 shadow-sm">

        <form method="POST">

            {% csrf_token %}

            <textarea
                name="message"
                class="form-control mb-3"
                rows="3"
                placeholder="Ask something..."
                required></textarea>

            <button class="btn btn-primary w-100">
                Send Message
            </button>

        </form>

    </div>

</div>

</body>
</html>
